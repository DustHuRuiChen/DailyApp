name: dailyapp
x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2022-latest@sha256:e10cd49443c94dbdcb7a050987db22ff4d8c87052ac53768abe1ed848d3fcef6

services:
  db-key:
    image: *sql-image
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /keys/sa ]; then
          umask 077
          random=$$(od -An -v -N 24 -tx1 /dev/urandom | tr -d '[:space:]')
          test "$${#random}" -eq 48
          printf 'Da1!%s' "$$random" > /keys/sa.new
          chown 10001:0 /keys/sa.new
          chmod 0440 /keys/sa.new
          mv /keys/sa.new /keys/sa
        fi
    volumes:
      - dailyapp-db-key:/keys

  db:
    image: *sql-image
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    command:
      - /bin/bash
      - -ec
      - |
        export MSSQL_SA_PASSWORD="$$(cat /keys/sa)"
        exec /opt/mssql/bin/sqlservr
    volumes:
      - dailyapp-sql-data:/var/opt/mssql
      - dailyapp-db-key:/keys:ro
    depends_on:
      db-key:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'SQLCMDPASSWORD="$$(cat /keys/sa)" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  api:
    image: dailyapp-api:2026-11-26
    platform: linux/amd64
    pull_policy: never
    environment:
      ConnectionStrings__ConnStr: "Server=db,1433;Database=DailyApp;User Id=sa;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Database__PasswordFile: /keys/sa
      Database__ApplyMigrations: "true"
    ports:
      - "127.0.0.1:33333:8080"
    volumes:
      - dailyapp-db-key:/keys:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  dailyapp-sql-data:
  dailyapp-db-key:
